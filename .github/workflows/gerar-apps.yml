# =====================================================================
#  Dente Sempre — gera os aplicativos
#
#  Roda manualmente: Actions > Gerar aplicativos > Run workflow
#  Ou ao criar uma tag: git tag v1.0.1 && git push --tags
#
#  Versão dos apps (24/11): sai sozinha. Com tag, é a da tag (v1.2.3 → 1.2.3).
#  No Run workflow, é a que você escrever em "Versão"; vazio = a última tag
#  v* + 1 (v1.1.1 → 1.1.2). O resumo da execução diz qual tag usar na release.
#
#  Lê servidor e chave pública do arquivo app/config.json
# =====================================================================
name: Gerar aplicativos

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (ex.: 1.1.3). Vazio = a última versão + 1'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: gerar-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versao:
    name: Número da versão
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
      codigo: ${{ steps.v.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        name: Escolher a versão
        shell: bash
        env:
          ENTRADA: ${{ inputs.versao }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          elif [ -n "$ENTRADA" ]; then V="${ENTRADA#v}"
          else
            U=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1); U="${U#v}"
            if [ -z "$U" ]; then V=1.0.0; else IFS=. read -r A B C <<< "$U"; V="$A.$B.$(( ${C%%[!0-9]*} + 1 ))"; fi
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Versão inválida: $V (use o formato 1.2.3)"; exit 1; fi
          IFS=. read -r A B C <<< "$V"
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "codigo=$(( A * 10000 + B * 100 + C ))" >> "$GITHUB_OUTPUT"
          echo "### Versão $V" >> "$GITHUB_STEP_SUMMARY"
          echo "Crie a release com a tag **v$V**." >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows (instalador .exe)
    needs: versao
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/desktop/package-lock.json

      - name: Conferir config.json
        run: |
          node -e "
            const c = require('./config.json');
            const erro = m => { console.log('::error::' + m); process.exit(1); };
            let u; try { u = new URL(String(c.servidor || '')); } catch (e) { erro('config.json: servidor vazio ou inválido. Coloque o endereço https:// do servidor.'); }
            if (u.protocol !== 'https:') erro('config.json: o servidor precisa começar com https://');
            if (u.hostname === 'api.seudominio.com.br') erro('config.json: o servidor ainda é o endereço de exemplo. Coloque o endereço real.');
            if (!String(c.chavePublica || '').trim()) erro('config.json: chavePublica vazia. No servidor, rode: dente-sempre chave-publica');
            console.log('Servidor: ' + u.origin);
          "

      - name: Instalar
        run: npm ci && npm --prefix desktop ci

      - name: Preparar página
        run: node preparar.js

      - name: Número da versão no programa
        working-directory: app/desktop
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: npm version "$VERSAO" --no-git-tag-version --allow-same-version

      - name: Gerar instalador
        working-directory: app/desktop
        run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dente-sempre-windows
          path: app/desktop/dist/*.exe
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: versao
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/celular/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            app/celular/android/*.gradle*
            app/celular/android/**/gradle-wrapper.properties

      - name: Conferir config.json
        run: |
          node -e "
            const c = require('./config.json');
            const erro = m => { console.log('::error::' + m); process.exit(1); };
            let u; try { u = new URL(String(c.servidor || '')); } catch (e) { erro('config.json: servidor vazio ou inválido. Coloque o endereço https:// do servidor.'); }
            if (u.protocol !== 'https:') erro('config.json: o servidor precisa começar com https://');
            if (u.hostname === 'api.seudominio.com.br') erro('config.json: o servidor ainda é o endereço de exemplo. Coloque o endereço real.');
            if (!String(c.chavePublica || '').trim()) erro('config.json: chavePublica vazia. No servidor, rode: dente-sempre chave-publica');
            console.log('Servidor: ' + u.origin);
          "

      - name: Instalar
        run: npm ci && npm --prefix celular ci

      - name: Preparar página e copiar para o Android
        run: |
          node preparar.js
          cd celular && npx cap sync android

      - name: Gerar APK de teste (debug)
        working-directory: app/celular/android
        env:
          DS_VERSAO: ${{ needs.versao.outputs.versao }}
          DS_VERSAO_CODIGO: ${{ needs.versao.outputs.codigo }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dente-sempre-android
          path: app/celular/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
